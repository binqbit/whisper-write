[package]
name = "whisper-write"
version = "1.0.1"
edition = "2021"

[dependencies]
anyhow = "1"
arboard = "3"
clap = { version = "4", features = ["derive"] }
cpal = "0.15"
crossbeam-channel = "0.5"
dotenvy = "0.15"
enigo = "0.1"
hound = "3"
reqwest = { version = "0.12", features = [
    "blocking",
    "multipart",
    "json",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
daemonize = "0.5"
libc = "0.2"
